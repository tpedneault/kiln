[package]
name = "kiln"
description = "Requirements, design decisions and project progress, kept as Markdown in the repository they describe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
# `cargo run -p kiln` runs the CLI, not kilnw (ADR-010).
default-run = "kiln"

[lints]
workspace = true

[dependencies]
clap.workspace = true
kiln-model.workspace = true
kiln-parse.workspace = true
kiln-index.workspace = true
kiln-check.workspace = true
kiln-git.workspace = true
kiln-fenix.workspace = true
fenix-storage.workspace = true
serde_json.workspace = true
kiln-export.workspace = true
kiln-render.workspace = true
kiln-confluence.workspace = true
kiln-secrets.workspace = true
kiln-lsp.workspace = true
kiln-flint.workspace = true
kiln-gui.workspace = true
kiln-jira.workspace = true
dirs.workspace = true

[[bin]]
name = "kiln"
path = "src/main.rs"

# Windows: opens the GUI without a console window (docs/GUI.md, "Windows:
# two executables"). Elsewhere it is the same as `kiln gui`.
[[bin]]
name = "kilnw"
path = "src/bin/kilnw.rs"

[dev-dependencies]
kiln-confluence = { workspace = true, features = ["fake"] }
kiln-jira = { workspace = true, features = ["fake"] }
tempfile.workspace = true
