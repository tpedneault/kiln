# The software requirements specification (`kiln preset add srs`): one
# document. `kiln export srs` writes it.
[[export]]
name = "srs"
format = "markdown"
title = "{name} — software requirements specification"
template = "{dir}/templates/srs.md"
path = "docs/SRS.md"

# To publish the same document to Confluence, set [confluence] url and
# space, then uncomment this target and set its parent page:
# [[export]]
# name = "srs-confluence"
# format = "confluence"
# title = "{name} — software requirements specification"
# template = "{dir}/templates/srs.md"
# [export.confluence]
# parent = 123456789          # the page the document goes under
