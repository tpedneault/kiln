# Types and link roles the arc42 template places (https://arc42.org).
# `kiln preset add` adds those kiln.toml doesn't declare yet and keeps the
# others as they are.

# Section 1.2: the three to five quality goals that matter most to the
# people the system is for.
[types.quality-goal]
prefix = "QG"
title = "Quality goal"
statuses = ["proposed", "agreed", "obsolete"]
closed = ["obsolete"]

# Section 10: scenarios that make a goal concrete and testable, each with
# its goal as `parent`.
[types.quality-scenario]
prefix = "QS"
title = "Quality scenario"
statuses = ["proposed", "agreed", "met", "obsolete"]
done = ["met"]
closed = ["obsolete"]
parents = ["quality-goal"]
template = "{dir}/templates/quality-scenario.md"

# Section 2: technical and organisational constraints, and conventions.
[types.constraint]
prefix = "CON"
statuses = ["proposed", "accepted", "obsolete"]
closed = ["obsolete"]

# Section 5: building blocks, nested by `parent` (arc42's levels 1, 2, 3).
[types.block]
prefix = "BB"
title = "Building block"
statuses = ["draft", "accepted", "obsolete"]
closed = ["obsolete"]
parents = ["block"]
template = "{dir}/templates/building-block.md"

# Section 9: architecture decisions.
[types.decision]
prefix = "ADR"
statuses = ["proposed", "accepted", "rejected", "superseded"]
closed = ["rejected", "superseded"]

# Section 11: risks and technical debt.
[types.risk]
prefix = "RISK"
statuses = ["open", "mitigated", "accepted", "closed"]
closed = ["closed"]

# Section 12: one item per term; its body is the definition.
[types.term]
prefix = "TERM"
title = "Term"
plural = "Glossary"
statuses = ["proposed", "accepted", "obsolete"]
closed = ["obsolete"]

[links.addresses]
from = ["decision", "block"]
to = ["quality-goal", "quality-scenario"]
inverse = "addressed by"

[links.supersedes]
from = ["decision"]
to = ["decision"]
inverse = "superseded by"

[links.mitigates]
from = ["decision", "block"]
to = ["risk"]
inverse = "mitigated by"
