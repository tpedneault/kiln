[workspace]
resolver = "2"
# Pure crates first, then the ones whose role is I/O, then the binary
# (docs/ARCHITECTURE.md). `kiln-gui` joins in K7, so nothing graphical
# enters the build before it is needed.
members = [
    "crates/kiln-model",
    "crates/kiln-parse",
    "crates/kiln-index",
    "crates/kiln-check",
    "crates/kiln-render",
    "crates/kiln-export",
    "crates/kiln-confluence",
    "crates/kiln-git",
    "crates/kiln-lsp",
    "crates/kiln-flint",
    "crates/kiln-gui",
    "crates/kiln-fenix",
    "crates/kiln-secrets",
    "crates/kiln",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpedneault/kiln"
authors = ["Thomas Pedneault <thomas@pedneault.dev>"]
# The crates are Kiln's own building blocks, not libraries on crates.io.
publish = false

# Every external dependency is declared here once, and crates take it with
# `workspace = true`. Fenix and Flint crates go here too, by git and pinned
# `rev`, only those DESIGN.md lists, added by the milestone that first uses
# them (DESIGN.md, "Dependencies on Fenix and Flint crates").
[workspace.dependencies]
kiln-model = { path = "crates/kiln-model" }
kiln-parse = { path = "crates/kiln-parse" }
kiln-index = { path = "crates/kiln-index" }
kiln-check = { path = "crates/kiln-check" }
kiln-git = { path = "crates/kiln-git" }
kiln-fenix = { path = "crates/kiln-fenix" }
kiln-render = { path = "crates/kiln-render" }
kiln-export = { path = "crates/kiln-export" }
kiln-confluence = { path = "crates/kiln-confluence" }
kiln-secrets = { path = "crates/kiln-secrets" }
kiln-lsp = { path = "crates/kiln-lsp" }
kiln-flint = { path = "crates/kiln-flint" }
kiln-gui = { path = "crates/kiln-gui" }

clap = { version = "4.5", features = ["derive"] }
dirs = "6"
# The same store and features as Flint (pure Rust, no libdbus): one token
# stored by either tool serves both.
keyring = { version = "3.6", features = ["windows-native", "async-secret-service", "async-io", "crypto-rust"] }
rpassword = "7"
# The language server: synchronous, as rust-analyzer; `lsp-types` at the
# minor Fenix's client uses.
lsp-server = "0.7"
crossbeam-channel = "0.5"
lsp-types = "0.97"
ignore = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
rayon = "1"
quick-xml = "0.38"
# The same as `fenix-jira`: native certificates, so a TLS-intercepting
# corporate proxy works (DESIGN.md, "Security").
ureq = { version = "2", features = ["tls", "native-certs", "json"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fontdb = "0.23"
tempfile = "3"
# The same minor as `fenix-storage`, so the build carries one copy.
toml_edit = "0.22"
# The GUI (K7): the same stack and versions as Fenix and Flint, so text
# and colours look alike.
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.12"
pollster = "1"
wgpu = "30.0.1"
winit = { version = "0.30.13", default-features = false }

fenix-storage = { git = "https://github.com/tpedneault/fenix", rev = "ce118a2af1a0b70733d0a2dd426f94365cf5eb1a" }
fenix-diagram = { git = "https://github.com/tpedneault/fenix", rev = "ce118a2af1a0b70733d0a2dd426f94365cf5eb1a" }
fenix-control = { git = "https://github.com/tpedneault/fenix", rev = "ce118a2af1a0b70733d0a2dd426f94365cf5eb1a" }
fenix-keymap = { git = "https://github.com/tpedneault/fenix", rev = "ce118a2af1a0b70733d0a2dd426f94365cf5eb1a" }
flint-protocol = { git = "https://github.com/tpedneault/flint", rev = "eb23547eb5939a52b8de06c298271ce4c8604927" }

[workspace.lints.rust]
# Nothing Kiln does needs `unsafe`. Denied rather than forbidden so a
# platform call that truly needs it (K7's Windows console attach) can
# allow it locally, next to a comment saying why.
unsafe_code = "deny"

[workspace.lints.clippy]
# No panics on bad input from files, config, servers or peers (CLAUDE.md).
# `unwrap` hides the reason a value was assumed present; outside tests,
# handle the error or `expect` it with the invariant spelled out.
# Tests may unwrap (clippy.toml).
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
