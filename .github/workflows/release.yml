name: Release

# A tag vX.Y.Z publishes a GitHub release with Windows and Linux archives
# (docs/CI.md, "Releasing"). The release stays a draft until every
# archive is uploaded, so a failed build never leaves a half release.
#
# It starts two ways: pushing the tag, or "Run workflow" on master with
# the version, which creates the tag itself on master's head. A tag
# pushed with this workflow's own token starts no other workflow, so the
# second way can't hand over to the first: it creates the tag and goes
# on in the same run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release, X.Y.Z: master is tagged vX.Y.Z'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: '1'
  # The tag being released: the one pushed, or v + the version asked for.
  # Steps read it from the environment, never pasted into a script.
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  prepare:
    name: Check version and draft the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run by hand only from master
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master'
        run: |
          Write-Error "release: run the Release workflow on master, not $env:GITHUB_REF"
          exit 1
      - name: Tag, Cargo.toml and CHANGELOG.md agree
        run: ./scripts/release.ps1 -Step check -Tag $env:TAG
      - name: Create the tag on master's head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A lightweight tag through the API, so no credentials stay in the
          # checkout. A version is released once: an existing tag is reused
          # only while no release has it (a run that failed before
          # drafting), and the build then uses the tagged commit.
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Error "release: $env:TAG is released already"; exit 1 }
          $tagged = gh api "repos/$env:GH_REPO/git/ref/tags/$env:TAG" --jq .object.sha 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagged) {
            Write-Host "release: $env:TAG exists at $tagged with no release; reusing it"
            exit 0
          }
          gh api "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$env:TAG" -f "sha=$env:GITHUB_SHA" --silent
          if ($LASTEXITCODE -ne 0) { Write-Error "release: couldn't create $env:TAG"; exit 1 }
      - name: Draft the release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A child pwsh, so its exit code is always set: a script run in
          # this one leaves $LASTEXITCODE unset when it succeeds, and
          # `exit $null` would end this step before the release is drafted.
          pwsh -NoProfile -File ./scripts/release.ps1 -Step notes -Tag $env:TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $prerelease = if ($env:TAG -like '*-*') { @('--prerelease') } else { @() }
          gh release create $env:TAG --draft --verify-tag --title "Kiln $($env:TAG.TrimStart('v'))" --notes-file target/dist/notes.md @prerelease

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-2022
          # The oldest supported runner, so the binary needs glibc 2.35 at
          # most and runs in older CI containers (Debian 12, Ubuntu 22.04).
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The tagged commit, whichever way the run started.
          ref: refs/tags/${{ env.TAG }}
      - name: Install Rust stable with Clippy and rustfmt
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable
      - name: Configure Windows Git paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.autocrlf false
      # What ships passes the same gates as every pull request, on the
      # runner that builds it.
      - name: Format, lint and test
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./scripts/ci.ps1
      - name: Build and archive kiln and kilnw
        run: ./scripts/release.ps1 -Step package -Tag $env:TAG
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $files = Get-ChildItem target/dist -File | Where-Object { $_.Name -match '\.(zip|tar\.gz)(\.sha256)?$' } | ForEach-Object FullName
          gh release upload $env:TAG @files --clobber

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Undraft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false
